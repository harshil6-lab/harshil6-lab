<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Service mesh of my stack: distributed, data, backend, infra and automation connected to a central hub." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .t{font-size:13px;font-weight:700}
    .i{font-size:11px;fill:#9FB3D1}
    .link{stroke:#2B6CB0;stroke-width:1.6;stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
    .ring{animation:ring 3s ease-in-out infinite;transform-origin:450px 195px}
    @keyframes ring{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.1;transform:scale(1.25)}}
  </style>

  <rect width="900" height="400" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="898" height="398" rx="15" fill="none" stroke="#22304D" stroke-width="2"/>

  <!-- links (drawn first, under nodes) -->
  <g>
    <line class="link" x1="450" y1="195" x2="150" y2="75"/>
    <line class="link" x1="450" y1="195" x2="450" y2="75"/>
    <line class="link" x1="450" y1="195" x2="750" y2="75"/>
    <line class="link" x1="450" y1="195" x2="300" y2="320"/>
    <line class="link" x1="450" y1="195" x2="600" y2="320"/>
  </g>

  <!-- hub -->
  <circle cx="450" cy="195" r="44" fill="none" stroke="#22D3EE" stroke-width="2" class="ring"/>
  <circle cx="450" cy="195" r="38" fill="#0F1E3A" stroke="#22D3EE" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#E6EDF7">harshil</text>
  <text x="450" y="208" text-anchor="middle" class="mono" font-size="10" fill="#22D3EE">mTLS mesh</text>

  <g class="mono">
    <!-- distributed -->
    <rect x="30" y="30" width="240" height="90" rx="12" fill="#111A2E" stroke="#2B3F66"/>
    <text x="48" y="54" class="t" fill="#FBBF24">distributed</text>
    <text x="48" y="74" class="i">multi-service orchestration</text>
    <text x="48" y="91" class="i">mTLS service auth</text>
    <text x="48" y="108" class="i">containerized deployments</text>

    <!-- data -->
    <rect x="330" y="30" width="240" height="90" rx="12" fill="#111A2E" stroke="#2B3F66"/>
    <text x="348" y="54" class="t" fill="#22D3EE">data</text>
    <text x="348" y="74" class="i">airflow · postgresql</text>
    <text x="348" y="91" class="i">mysql · supabase · firebase</text>
    <text x="348" y="108" class="i">s3 data lake</text>

    <!-- backend -->
    <rect x="630" y="30" width="240" height="90" rx="12" fill="#111A2E" stroke="#2B3F66"/>
    <text x="648" y="54" class="t" fill="#3B82F6">backend</text>
    <text x="648" y="74" class="i">python · c · c++</text>
    <text x="648" y="91" class="i">fastapi · rest</text>
    <text x="648" y="108" class="i">smtp</text>

    <!-- infra -->
    <rect x="180" y="275" width="240" height="90" rx="12" fill="#111A2E" stroke="#2B3F66"/>
    <text x="198" y="299" class="t" fill="#34D399">infra</text>
    <text x="198" y="319" class="i">aws: ec2 · ebs · s3 · boto3</text>
    <text x="198" y="336" class="i">docker · linux</text>
    <text x="198" y="353" class="i">github actions · vercel</text>

    <!-- automation -->
    <rect x="480" y="275" width="240" height="90" rx="12" fill="#111A2E" stroke="#2B3F66"/>
    <text x="498" y="299" class="t" fill="#C084FC">automation</text>
    <text x="498" y="319" class="i">n8n workflows</text>
    <text x="498" y="336" class="i">openai · gemini</text>
    <text x="498" y="353" class="i">google apis</text>
  </g>
</svg>
