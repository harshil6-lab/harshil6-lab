<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="Architecture: Stripe and Salesforce flow into S3 raw JSON, then transform, then PostgreSQL warehouse, orchestrated by Airflow 3 with mTLS between services." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .t{font-size:14px;font-weight:700;fill:#E6EDF7}
    .s{font-size:11px;fill:#8FA3C4}
    .flow{fill:none;stroke:#2B3F66;stroke-width:2}
    .tie{stroke:#FBBF24;stroke-width:1.5;stroke-dasharray:4 5;opacity:.55;animation:dash 1.2s linear infinite}
    .mtls{stroke:#34D399;stroke-width:2;stroke-dasharray:8 6;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-22}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  </style>

  <rect width="900" height="370" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="898" height="368" rx="15" fill="none" stroke="#22304D" stroke-width="2"/>

  <!-- orchestrator bar -->
  <rect x="40" y="20" width="820" height="36" rx="9" fill="#111A2E" stroke="#3A3A22"/>
  <circle cx="60" cy="38" r="5" fill="#FBBF24" class="pulse"/>
  <text x="76" y="43" class="mono" font-size="13" font-weight="700" fill="#FBBF24">airflow 3.x</text>
  <text x="844" y="43" text-anchor="end" class="mono s">api-server · scheduler · triggerer · dag-processor · webserver</text>

  <!-- orchestration ties -->
  <line class="tie" x1="105" y1="56" x2="105" y2="92"/>
  <line class="tie" x1="335" y1="56" x2="335" y2="137"/>
  <line class="tie" x1="565" y1="56" x2="565" y2="137"/>
  <line class="tie" x1="795" y1="56" x2="795" y2="137"/>

  <!-- flow paths -->
  <path id="p1" class="flow" d="M170 117 C 225 117 215 162 270 162"/>
  <path id="p2" class="flow" d="M170 257 C 225 257 215 162 270 162"/>
  <path id="p3" class="flow" d="M400 162 L500 162"/>
  <path id="p4" class="flow" d="M630 162 L730 162"/>

  <!-- nodes -->
  <g class="mono">
    <rect x="40" y="92" width="130" height="50" rx="10" fill="#111A2E" stroke="#2B3F66"/>
    <text x="56" y="114" class="t">stripe</text><text x="56" y="130" class="s">payments api</text>

    <rect x="40" y="232" width="130" height="50" rx="10" fill="#111A2E" stroke="#2B3F66"/>
    <text x="56" y="254" class="t">salesforce</text><text x="56" y="270" class="s">jwt auth</text>

    <rect x="270" y="137" width="130" height="50" rx="10" fill="#111A2E" stroke="#2B3F66"/>
    <text x="286" y="159" class="t">s3</text><text x="286" y="175" class="s">raw json</text>

    <rect x="500" y="137" width="130" height="50" rx="10" fill="#111A2E" stroke="#2B3F66"/>
    <text x="516" y="159" class="t">transform</text><text x="516" y="175" class="s">python</text>

    <rect x="730" y="137" width="130" height="50" rx="10" fill="#0F1E3A" stroke="#3B82F6"/>
    <text x="746" y="159" class="t">postgresql</text><text x="746" y="175" class="s">warehouse</text>
  </g>

  <!-- data packets -->
  <g fill="#22D3EE">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="0.35s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.4s" begin="1.05s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
  </g>

  <!-- mTLS rail -->
  <line class="mtls" x1="335" y1="320" x2="795" y2="320"/>
  <line x1="335" y1="187" x2="335" y2="320" stroke="#34D399" stroke-width="1" opacity=".35"/>
  <line x1="565" y1="187" x2="565" y2="320" stroke="#34D399" stroke-width="1" opacity=".35"/>
  <line x1="795" y1="187" x2="795" y2="320" stroke="#34D399" stroke-width="1" opacity=".35"/>
  <text x="565" y="345" text-anchor="middle" class="mono s" style="fill:#34D399">mTLS · service-to-service auth</text>
</svg>
