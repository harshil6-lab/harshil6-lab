<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Harshil Kalsariya, backend, data pipelines, cloud cost. Status: open to work." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="900" height="200" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .muted{fill:#8FA3C4}
    .name{font-size:44px;font-weight:700;fill:#E6EDF7;letter-spacing:-0.5px}
    .sub{font-size:16px;fill:#9FB3D1}
    .tiny{font-size:12px}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.9)}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="200" fill="#0B1220"/>
    <rect x="1" y="1" width="898" height="198" rx="15" fill="none" stroke="#22304D" stroke-width="2"/>
    <!-- faint grid -->
    <g stroke="#16213A" stroke-width="1">
      <path d="M0 50H900M0 100H900M0 150H900"/>
      <path d="M150 0V200M300 0V200M450 0V200M600 0V200M750 0V200"/>
    </g>
    <!-- moving sweep line -->
    <rect x="-300" y="196" width="300" height="4" fill="url(#sweep)">
      <animate attributeName="x" from="-300" to="900" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="40" y="44" class="mono tiny muted">harshil-platform / status</text>
  <text x="40" y="104" class="sans name">Harshil Kalsariya</text>
  <text x="40" y="136" class="sans sub">Backend  ·  Data pipelines  ·  Cloud cost</text>
  <text x="40" y="170" class="mono tiny" fill="#22D3EE">$ ./serve --role backend,data<tspan class="cur" fill="#22D3EE"> █</tspan></text>

  <!-- status card -->
  <rect x="640" y="36" width="224" height="92" rx="12" fill="#111A2E" stroke="#22304D"/>
  <circle cx="666" cy="66" r="6" fill="#34D399" class="pulse"/>
  <circle cx="666" cy="66" r="6" fill="#34D399"/>
  <text x="684" y="71" class="mono" font-size="14" font-weight="700" fill="#34D399">OPEN TO WORK</text>
  <text x="658" y="96" class="mono tiny muted">region    surat, gujarat, in</text>
  <text x="658" y="114" class="mono tiny muted">seeking   backend · data</text>
</svg>
